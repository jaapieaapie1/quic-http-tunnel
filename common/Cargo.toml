[package]
name = "tunnel-common"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
http = "1.5.0"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["io-util"] }
tracing = "0.1.44"
x509-parser = "0.18.1"
